# PawConnect: todos los componentes de la sección 7 en una máquina.
#
#   cp .env.example .env
#   docker compose up -d db almacenamiento        # lo mínimo para desarrollar la API
#   docker compose up --build                      # todo: db, almacenamiento, reconocimiento, api, web
#
# web       http://localhost:3000
# api       http://localhost:8000/api/docs/   (admin en /admin/)
# reconocimiento  http://localhost:8001/docs
# MinIO     http://localhost:9001             (consola del almacenamiento)

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawconnect}
      POSTGRES_USER: ${POSTGRES_USER:-pawconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawconnect}
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawconnect}"]
      interval: 3s
      retries: 20

  almacenamiento:
    # S3 compatible. En producción se cambia por el almacenamiento de objetos del proveedor.
    image: ghcr.io/disaster37/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pawconnect}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pawconnect-secreto}
    ports: ["9000:9000", "9001:9001"]
    volumes: [almacenamiento:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  crear-bucket:
    image: ghcr.io/disaster37/minio:latest
    depends_on:
      almacenamiento: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://almacenamiento:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
             mc mb --ignore-existing local/$${S3_BUCKET} &&
             mc anonymous set none local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pawconnect}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pawconnect-secreto}
      S3_BUCKET: ${S3_BUCKET:-pawconnect-recortes}
    restart: "no"

  reconocimiento:
    build: ./reconocimiento
    ports: ["8001:8001"]
    volumes: [modelos:/root/.cache/huggingface]  # ~0,9 GB de pesos, se bajan una vez

  api:
    build: ./api
    depends_on:
      db: { condition: service_healthy }
      crear-bucket: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pawconnect}:${POSTGRES_PASSWORD:-pawconnect}@db:5432/${POSTGRES_DB:-pawconnect}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-solo-local-no-usar-en-produccion}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      RECONOCIMIENTO_URL: http://reconocimiento:8001
      S3_BUCKET: ${S3_BUCKET:-pawconnect-recortes}
      S3_ENDPOINT_URL: http://almacenamiento:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pawconnect}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pawconnect-secreto}
    ports: ["8000:8000"]

  web:
    build: ./web
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]

volumes:
  db:
  almacenamiento:
  modelos:
